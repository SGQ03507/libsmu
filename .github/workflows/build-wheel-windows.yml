name: Build pysmu wheel (Windows)

on:
  workflow_dispatch:

jobs:
  build-wheel-windows:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      CMAKE_BUILD_TYPE: Release
      INSTALL_PREFIX: C:/install/libsmu
      VCPKG_TRIPLET: x64-windows

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:USERPROFILE\vcpkg
          & $env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat
          "VCPKG_CHAIN_FILE=$env:USERPROFILE\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies with vcpkg (libusb + boost)
        shell: pwsh
        run: |
          & $env:USERPROFILE\vcpkg\vcpkg.exe install libusb --triplet $env:VCPKG_TRIPLET
          & $env:USERPROFILE\vcpkg\vcpkg.exe install boost  --triplet $env:VCPKG_TRIPLET

      - name: Prep Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel cffi

      # *** ADD *** ここでソースをパッチして MSVC C3536 を回避
 
      - name: Patch session.cpp for MSVC C3536 workaround
        shell: pwsh
        run: |
          $f = "src/session.cpp"
          if (-not (Test-Path $f)) { Write-Error "File not found: $f"; exit 1 }

          $src = Get-Content $f -Raw
          $pattern = '(?s)auto\s+now\s*=\s*std::chrono::system_clock::now\s*\(\s*\)\s*;\s*uint64_t\s+waitTime;.*?auto\s+res\s*=\s*m_completion\.wait_until\s*\(\s*lk\s*,\s*now\s*\+\s*std::chrono::seconds\s*\(\s*waitTime\s*\)\s*,\s*\[\s*&\s*\]\s*\{\s*return\s+m_active_devices\s*==\s*0\s*;\s*\}\s*\)\s*;\s*if\s*\(\s*!\s*res\s*\)\s*\{'
          $replacement = @"
  auto now = std::chrono::system_clock::now ();
  uint64_t waitTime;
  if (m_sample_rate != 0) {
    waitTime = (m_samples/m_sample_rate + 1) + 1;
  } else {
    waitTime = 0;
  }
  auto pred = [&] { return m_active_devices == 0; };
  bool done = m_completion.wait_until(lk, now + std::chrono::seconds(waitTime), pred);
  if (!done) {
"@

          if ($src -match $pattern) {
            $src2 = [regex]::Replace($src, $pattern, $replacement)
            Set-Content $f -Value $src2 -Encoding UTF8
            Write-Host "Patched $f for MSVC C3536 workaround."
          } else {
            Write-Warning "Patch pattern not found. Continue build without patch (may fail with C3536)."
            # ここでは exit しない：Build pysmu wheel まで進めるため
          }

      - name: Configure & build libsmu with MSVC
        shell: pwsh
        run: |
          $tripletRoot = "$env:USERPROFILE/vcpkg/installed/$env:VCPKG_TRIPLET"
          $libusbInc = "$tripletRoot/include/libusb-1.0"
          $libusbLib = "$tripletRoot/lib/libusb-1.0.lib"

          Write-Host "LIBUSB_INCLUDE_DIRS=$libusbInc"
          Write-Host "LIBUSB_LIBRARIES=$libusbLib"

          if (Test-Path build) { Remove-Item -Recurse -Force build }
          mkdir build
          cd build

          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=%CMAKE_BUILD_TYPE% `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_CHAIN_FILE" `
            -DLIBUSB_INCLUDE_DIRS="$libusbInc" `
            -DLIBUSB_LIBRARIES="$libusbLib" `
            -DBUILD_TESTS=OFF `
            -DBUILD_EXAMPLES=OFF `
            -DBUILD_CLI=OFF `
            -DCMAKE_CXX_STANDARD=17 `                             # *** ADD ***
            -DCMAKE_CXX_STANDARD_REQUIRED=ON                      # *** ADD ***

          cmake --build . --config Release -- /m

      - name: Put libsmu DLL next to pysmu package
        shell: pwsh
        run: |
          # Visual Studio の出力場所（例：build/src/Release/…）などを再帰探索
          $dll = Get-ChildItem -Recurse -Path ".\build" -Filter "*smu*.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $dll) {
            Write-Host "Try common locations…"
            $cand1 = ".\build\src\Release\smu.dll"
            $cand2 = ".\build\Release\smu.dll"
            if (Test-Path $cand1) { $dll = Get-Item $cand1 }
            elseif (Test-Path $cand2) { $dll = Get-Item $cand2 }
          }

          if (-not $dll) { Write-Error "smu DLL not found under build/ tree" }

          New-Item -ItemType Directory -Force -Path bindings/python/pysmu | Out-Null
          Copy-Item $dll.FullName bindings/python/pysmu/libsmu.dll -Force
          Write-Host "Copied $($dll.FullName) -> bindings/python/pysmu/libsmu.dll"

      - name: Clean Python binding folder
        shell: pwsh
        working-directory: bindings/python
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path pysmu.egg-info) { Remove-Item -Recurse -Force pysmu.egg-info }

      - name: Build pysmu wheel (Windows)
        shell: pwsh
        working-directory: bindings/python
        run: |
          python -m build --wheel

      - name: Upload wheel (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: pysmu-wheel-windows
          path: bindings/python/dist/*.whl
          retention-days: 7
