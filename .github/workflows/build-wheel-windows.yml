
name: Build pysmu wheel (Windows)

on:
  workflow_dispatch:

jobs:
  build-wheel-windows:
    runs-on: windows-latest

    env:
      CMAKE_BUILD_TYPE: Release
      INSTALL_PREFIX: C:/install/libsmu
      VCPKG_TRIPLET: x64-windows

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python 3.14
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install build tools (vcpkg)
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg.git $env:USERPROFILE\vcpkg
          & $env:USERPROFILE\vcpkg\bootstrap-vcpkg.bat
          # vcpkg toolchain のパスを Actions 環境へ
          "VCPKG_CHAIN_FILE=$env:USERPROFILE\vcpkg\scripts\buildsystems\vcpkg.cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Install dependencies with vcpkg (libusb + boost-math + pkgconf)
        shell: pwsh
        run: |
          # vcpkg で必要最小限の依存を導入
          & $env:USERPROFILE\vcpkg\vcpkg.exe install libusb --triplet $env:VCPKG_TRIPLET
          & $env:USERPROFILE\vcpkg\vcpkg.exe install boost-math --triplet $env:VCPKG_TRIPLET
          # pkg-config 互換 (pkgconf) を導入
          & $env:USERPROFILE\vcpkg\vcpkg.exe install pkgconf --triplet $env:VCPKG_TRIPLET

          # CMake が pkg-config を使えるよう、実行ファイルと .pc のパスを環境に通す
          $pkgconf = Join-Path $env:USERPROFILE "vcpkg\installed\$env:VCPKG_TRIPLET\tools\pkgconf\pkgconf.exe"
          $pcpath  = Join-Path $env:USERPROFILE "vcpkg\installed\$env:VCPKG_TRIPLET\lib\pkgconfig"
          if (!(Test-Path $pkgconf)) { Write-Error "pkgconf not found at $pkgconf" }
          if (!(Test-Path $pcpath))  { Write-Error "pkg-config .pc path not found at $pcpath" }

          # Actions の後続ステップへ環境変数を引き継ぐ
          "PKG_CONFIG=$pkgconf"     | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PKG_CONFIG_PATH=$pcpath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          # デバッグ：見えるか確認（失敗しても続行）
          & $pkgconf --version
          Get-ChildItem $pcpath | Select-Object -First 10 | ForEach-Object { $_.Name }

      - name: Prep Python packages
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install --upgrade build setuptools wheel cffi

      - name: Configure & build libsmu with MSVC (Visual Studio generator)
        shell: pwsh
        run: |
          mkdir build
          cd build
          cmake .. `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_BUILD_TYPE=%CMAKE_BUILD_TYPE% `
            -DCMAKE_INSTALL_PREFIX="${env:INSTALL_PREFIX}" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_CHAIN_FILE" `
            -DPython3_EXECUTABLE="$((Get-Command python).Source)"
          cmake --build . --config Release
          cmake --install . --config Release

      - name: Put libsmu.dll next to pysmu package
        shell: pwsh
        run: |
          $dll = "${env:INSTALL_PREFIX}\bin\libsmu.dll"
          if (!(Test-Path $dll)) {
            Write-Error "libsmu.dll not found at $dll"
          }
          Copy-Item $dll bindings/python/pysmu/libsmu.dll -Force

      - name: Clean python binding folder
        shell: pwsh
        working-directory: bindings/python
        run: |
          if (Test-Path build) { Remove-Item -Recurse -Force build }
          if (Test-Path dist) { Remove-Item -Recurse -Force dist }
          if (Test-Path pysmu.egg-info) { Remove-Item -Recurse -Force pysmu.egg-info }

      - name: Build pysmu wheel (Windows)
        shell: pwsh
        working-directory: bindings/python
        run: |
          python -m build --wheel

      - name: Upload wheel (Windows)
        uses: actions/upload-artifact@v4
        with:
          name: pysmu-wheel-windows
          path: bindings/python/dist/*.whl
          retention-days: 7
