
name: Build pysmu wheel

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libusb-1.0-0-dev \
            libboost-all-dev \
            python3-dev \
            python3-pip
          python3 -m pip install --upgrade pip

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build libsmu
        run: |
          mkdir -p build
          cd build
          cmake -G "Ninja" ..
          ninja -v
          sudo ninja install
          sudo ldconfig

      - name: Build pysmu wheel
        run: |
          cd bindings/python
          python3 -m pip install --upgrade build setuptools wheel
          python3 -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pysmu-wheel
          path: bindings/python/dist/*.whl
          retention-days: 7
