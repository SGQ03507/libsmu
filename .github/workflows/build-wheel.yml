
name: Build pysmu wheel

on:
  workflow_dispatch:

jobs:
  build-wheel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y libusb-1.0-0-dev cmake build-essential python3-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Build libsmu
        run: |
          mkdir build
          cd build
          cmake ..
          make -j4
          sudo make install

      - name: Build pysmu wheel
        run: |
          cd bindings/python
          python3 -m pip install build
          python3 -m build --wheel

      - name: Upload wheel
        uses: actions/upload-artifact@v4
        with:
          name: pysmu-wheel
          path: bindings/python/dist/*.whl
          retention-days: 7
